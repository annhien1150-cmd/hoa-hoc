<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Core - Lò Phản Ứng Tương Lai</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #ff0844;
            --bg-dark: #0a0e17;
            --card-bg: rgba(16, 24, 40, 0.85);
            --text-light: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 15px 30px;
            background: rgba(10, 14, 23, 0.9);
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .score-board {
            font-size: 1.1rem;
            background: rgba(0, 242, 254, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Canvas mô phỏng Hạt nhân */
        .simulation-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        #canvas3d {
            width: 100%;
            height: 250px;
            background: #000;
            border-radius: 12px;
            margin-top: 10px;
        }

        /* Khung trợ lý AI */
        .ai-assistant {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.15), rgba(0, 242, 254, 0.05));
            border-left: 4px solid var(--primary);
            padding: 15px 20px;
            border-radius: 8px;
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ai-avatar {
            width: 45px;
            height: 45px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 15px var(--primary);
        }

        /* Card câu hỏi Quiz */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .category-tag {
            display: inline-block;
            padding: 5px 12px;
            background: rgba(0, 242, 254, 0.2);
            color: var(--primary);
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 1.25rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media(min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-light);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--primary);
        }

        .option-btn.correct {
            background: rgba(0, 230, 118, 0.25) !important;
            border-color: #00e676 !important;
            color: #00e676;
        }

        .option-btn.wrong {
            background: rgba(255, 82, 82, 0.25) !important;
            border-color: #ff5252 !important;
            color: #ff5252;
        }

        /* Khung giải thích */
        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: none;
            border-left: 3px solid #ffb300;
        }

        /* Nút chuyển câu */
        .next-btn {
            margin-top: 20px;
            padding: 12px 25px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            float: right;
            display: none;
        }

        /* Màn hình kết thúc */
        .result-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .result-title {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">⚛️ NUCLEAR CORE - GAME QUIZ AI</div>
        <div class="score-board">Điểm: <span id="score">0</span> / 150</div>
    </header>

    <div class="container">
        <!-- AI Host Message -->
        <div class="ai-assistant">
            <div class="ai-avatar">AI</div>
            <div class="ai-text" id="ai-msg">Xin chào các kỹ sư hạt nhân! Hãy trả lời chính xác các câu hỏi để tích lũy năng lượng cho lò phản ứng.</div>
        </div>

        <!-- Mô phỏng 3D Canvas -->
        <div class="simulation-card">
            <h3 id="sim-title">Mô phỏng: Phóng xạ nhân tạo</h3>
            <canvas id="canvas3d"></canvas>
        </div>

        <!-- Khung Quiz Game -->
        <div class="quiz-card" id="quiz-box">
            <div class="category-tag" id="category">Phần 1: Phóng xạ nhân tạo</div>
            <div class="question-text" id="question">Đang tải câu hỏi...</div>
            <div class="options-grid" id="options"></div>
            <div class="explanation-box" id="explanation"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➔</button>
        </div>

        <!-- Màn hình Tổng kết -->
        <div class="quiz-card result-screen" id="result-box">
            <h2 class="result-title">🎉 HOÀN THÀNH THỬ THÁCH!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 20px;" id="final-score"></p>
            <p id="final-eval" style="color: #aaa; margin-bottom: 25px;"></p>
            <button class="next-btn" style="display:inline-block; float:none;" onclick="location.reload()">Chơi lại từ đầu 🔄</button>
        </div>
    </div>
